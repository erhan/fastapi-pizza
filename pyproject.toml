[project]
name = "fastapi-pizza"
version = "0.2.0"
description = "A Slice of FastAPI: example pizza API for the Python Pizza Istanbul 2026 talk"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.16",
    "fastapi[standard]>=0.161.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# the local alembic/ folder holds the migrations; `import alembic` is the installed package
known-third-party = ["alembic"]
